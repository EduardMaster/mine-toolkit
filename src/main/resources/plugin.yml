name: "MineToolkit"
description: "A powerful toolkit designed to speed up the creation of plugins by providing a solid foundation of essential utilities and automated systems."
main: "br.com.eduard.mine_toolkit.MineToolkitMain"
version: "2.0.0"
author: "Eduard"
api-version: 1.18
authors: [ "Eduard" ]
softdepend: [ Multiverse-Core,Vault,PermissionEX,LegendChat,HolographicDisplays,Citizens,Essentials,JH_Shop ]
website: "https://www.youtube.com/user/EduTutoriaisHD"
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.3.0
  - org.jetbrains.kotlin:kotlin-reflect:2.3.0
commands:
  map:
    description: "Controla os Mapas criados (baseado no Schematic do WorldEdit)"
    aliases: [ mapa ]
    usage: "/<command> help"
  api:
    description: "Controla plugins feitos pelo Edu"
    aliases: [ eduardapi,eduard,e ]
    usage: "/<command> help"




